# Contrato de imagen web: Apache 2.4, mod_rewrite/mod_proxy/mod_proxy_http/
# mod_headers/mod_remoteip cargados; config principal preparada para UID 10001 y /tmp.
Listen 8080
PidFile /tmp/httpd.pid
DefaultRuntimeDir /tmp
ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8080>
    DocumentRoot "/usr/local/apache2/htdocs"
    ProxyRequests Off
    ProxyPreserveHost On
    # No confiar en cabeceras reenviadas suministradas por el cliente.
    # Este listener solo se publica en loopback para cloudflared HTTPS.
    # cloudflared en el host debe conservar CF-Connecting-IP de Cloudflare.
    # El salto Docker del host usa el gateway fijado del subnet edge.
    # Confirmar este peer real en QA; no confiar en redes completas ni '*'.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 172.30.237.1
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Proto "https"
    ProxyAddHeaders On
    ProxyPass        /api/ http://backend:8000/ connectiontimeout=5 timeout=60
    ProxyPassReverse /api/ http://backend:8000/
    ProxyPassReverseCookiePath /auth /api/auth
    RedirectMatch 308 ^/api$ /api/
    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api(?:/|$)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [END]
    </Directory>
    # Base conservadora: incluye HTML, JS, PDF y respuestas autenticadas.
    Header always set Cache-Control "no-store, max-age=0"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
