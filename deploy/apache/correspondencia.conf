<VirtualHost *:80>
    DocumentRoot /var/www/correspondencia

    <Directory /var/www/correspondencia>
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # No interceptar API
        RewriteCond %{REQUEST_URI} !^/api/

        # SPA Flutter
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # Reverse proxy only; no forward proxy.
    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass        /api/ http://127.0.0.1:8000/
    ProxyPassReverse /api/ http://127.0.0.1:8000/

    # El backend sigue emitiendo la cookie con Path=/auth.
    # Desde el navegador las rutas son /api/auth.
    ProxyPassReverseCookiePath /auth /api/auth

    ErrorLog ${APACHE_LOG_DIR}/correspondencia_error.log
    CustomLog ${APACHE_LOG_DIR}/correspondencia_access.log combined
</VirtualHost>
