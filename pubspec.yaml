name: correspondencia_sipe_sipe
description: Sistema de Correspondencia GAM Sipe Sipe.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  intl: ^0.19.0
  responsive_framework: ^1.4.0
  get_it: ^8.0.2
  dio: ^5.7.0
  go_router: ^14.3.0
  url_strategy: ^0.3.0

  # Local architecture packages — match Capturador / Inventarios.
  failures:
    path: packages/failures
  correspondencia_api:
    path: packages/correspondencia_api
  correspondencia_repository:
    path: packages/correspondencia_repository
  data_table_2: 2.5.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
