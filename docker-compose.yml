services:
  postgres:
    image: postgres:16-alpine
    container_name: sipe_correspondencia_db
    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-correspondencia_sipe}
      POSTGRES_USER: ${POSTGRES_USER:-sipe_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipe_dev_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sipe_app} -d ${POSTGRES_DB:-correspondencia_sipe}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sipe_correspondencia_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-correspondencia_sipe}
      POSTGRES_USER: ${POSTGRES_USER:-sipe_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipe_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sipe_app}:${POSTGRES_PASSWORD:-sipe_dev_password}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-correspondencia_sipe}
      # JWT_ACCESS_SECRET is REQUIRED: no fallback here. The deployment must
      # provide it via .env (gitignored) or the platform's secret store.
      # Startup validation in app.core.config.Settings enforces >=32 chars.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-correspondencia-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-correspondencia-web}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      COOKIE_NAME: ${COOKIE_NAME:-refresh_token}
      COOKIE_PATH: ${COOKIE_PATH:-/auth}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      APP_ENV: ${APP_ENV:-development}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
