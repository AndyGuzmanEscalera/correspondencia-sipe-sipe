services:
  postgres:
    image: postgres:16-alpine
    container_name: sipe_correspondencia_db
    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-correspondencia_sipe}
      POSTGRES_USER: ${POSTGRES_USER:-sipe_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipe_dev_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sipe_app} -d ${POSTGRES_DB:-correspondencia_sipe}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sipe_correspondencia_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-correspondencia_sipe}
      POSTGRES_USER: ${POSTGRES_USER:-sipe_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipe_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sipe_app}:${POSTGRES_PASSWORD:-sipe_dev_password}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-correspondencia_sipe}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
